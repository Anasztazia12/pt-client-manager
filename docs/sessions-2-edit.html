  <div class="page-head">
    <div>
      <p class="eyebrow back-link"><a href="clients-1.html">&larr; Emma Clarke</a></p>
      <h1 class="h3 mb-0">Edit session</h1>
    </div>
  </div>
  <form method="POST" novalidate class="col-lg-7 panel">
    
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label" for="date">Date</label>
        <input class="form-control" id="date" name="date" required type="date" value="2026-11-05">
        
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="session_type">Session type</label>
        <select class="form-select" id="session_type" name="session_type"><option value="">Not set</option><option selected value="strength">Strength</option><option value="cardio">Cardio</option><option value="hiit">HIIT</option><option value="mobility">Mobility &amp; stretching</option><option value="assessment">Assessment</option></select>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="duration_minutes">Duration (minutes)</label>
      <input class="form-control" id="duration_minutes" max="600" min="1" name="duration_minutes" type="number" value="60">
      
    </div>
    <div class="mb-3">
      <label class="form-label" for="notes">Notes</label>
      <textarea class="form-control" id="notes" name="notes" rows="3">
</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="clients-1.html" class="btn btn-link">Cancel</a>
  </form>

    </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('click', function (e) {
      var button = e.target.closest('[data-copy]');
      if (!button) return;
      navigator.clipboard.writeText(button.dataset.copy).then(function () {
        button.textContent = 'Copied';
        setTimeout(function () { button.textContent = 'Copy link'; }, 2000);
      }, function () {
        window.prompt('Copy this link:', button.dataset.copy);
      });
    });
  </script>
<script>
(function () {
  function toast(text) {
    var t = document.querySelector('.demo-toast');
    if (!t) { t = document.createElement('div'); t.className = 'demo-toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'calcForm') return;
    e.preventDefault();
    e.stopImmediatePropagation();
    toast('This is a demo, so nothing is saved.');
  }, true);
  document.addEventListener('click', function (e) {
    if (e.target.closest('a[data-demo-off]')) { e.preventDefault(); toast('This page is not part of the demo.'); }
  });
})();
</script></body>
